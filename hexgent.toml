# Hexgent 默认运行配置。未填写的字段会使用代码默认值。

# 暂停ContextRecord自动提取与召回；不影响长期Memory和压缩Snapshot。
[context_extraction]
enabled = false

[context_retrieval]
enabled = false

[loop]
# 是否启用模型轮次、工具次数、累计 Token 和总运行时间限制。
enforce_run_limits = true
max_model_rounds = 100
max_tool_calls = 300
max_total_tokens = 1000000
max_output_tokens_per_round = 8000
max_elapsed_seconds = 3600.0
finalization_output_tokens = 2000
max_plan_completion_nudges = 1

[context]
# 当前模型上下文窗口；应与 MODEL_ID 对应模型的真实容量一致。
context_window_tokens = 128000
reserved_output_tokens = 8000
safety_margin_tokens = 8000
summary_output_tokens = 2000
recent_context_tokens = 24000
reactive_recent_context_tokens = 8000
max_compaction_attempts = 2
min_compaction_savings_tokens = 2000
min_compaction_savings_ratio = 0.1
max_partial_compactions = 1

[tool_result]
# 超过该字符数的工具结果会完整外置，模型上下文只保留预览。
max_inline_characters = 50000
preview_characters = 500
max_batch_inline_tokens = 8000
max_batch_preview_tokens = 4000

[tool_parallel]
# 仅连续且声明为并行安全的工具会进入线程池。
enabled = false
max_workers = 8
batch_timeout_seconds = 60.0

[permission]
default_mode = "auto_approve"
